<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Swaraj Xavier — Full Stack Web Developer</title>
  <desc id="hero-desc">Developer system interface. Swaraj Xavier, full stack web developer. Interfaces, the systems behind them, and things worth shipping. Status: system online.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#131A23" stroke-width="1"/>
    </pattern>
    <radialGradient id="grid-fade" cx="74%" cy="50%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask"><rect width="880" height="380" fill="url(#grid-fade)"/></mask>
    <radialGradient id="core-glow">
      <stop offset="0" stop-color="#5CC8FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC8FF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5CC8FF" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="380" rx="16"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .orbit{transform-origin:668px 196px;animation:spin 56s linear infinite}
    .orbit-slow{transform-origin:668px 196px;animation:spin 140s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .scan{animation:scan 11s cubic-bezier(.45,0,.2,1) infinite}
    @keyframes scan{0%{transform:translateY(-140px)}50%,100%{transform:translateY(400px)}}
    .cur{animation:blink 1.2s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="380" fill="#07090C"/>
    <rect width="880" height="380" fill="url(#grid)" mask="url(#grid-mask)"/>

    <!-- orbital geometry -->
    <circle cx="668" cy="196" r="120" fill="url(#core-glow)" opacity=".5"/>
    <circle cx="668" cy="196" r="168" fill="none" stroke="#151C26" stroke-dasharray="2 7"/>
    <circle cx="668" cy="196" r="128" fill="none" stroke="#1B2430"/>
    <circle cx="668" cy="196" r="84" fill="none" stroke="#18202B"/>
    <path d="M668 20V60M668 332V372M484 196H524M812 196H852" stroke="#1E2733"/>
    <g class="orbit-slow">
      <circle cx="668" cy="28" r="2" fill="#2A3544"/>
      <circle cx="836" cy="196" r="2" fill="#2A3544"/>
    </g>
    <g class="orbit">
      <path d="M668 68A128 128 0 0 1 778.9 132" fill="none" stroke="url(#trail)" stroke-width="1.2"/>
      <circle cx="778.9" cy="132" r="3" fill="#5CC8FF"/>
    </g>
    <circle cx="668" cy="196" r="3.5" fill="#5CC8FF"/>
    <circle cx="668" cy="196" r="9" fill="none" stroke="#5CC8FF" stroke-opacity=".35"/>
    <text x="684" y="226" class="mono" font-size="10" fill="#3E4957" letter-spacing="1.5">NODE://SX</text>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="880" height="140" fill="url(#scan-band)"/>

    <!-- top bar -->
    <text x="40" y="46" class="mono" font-size="11" fill="#5B6675" letter-spacing="1.6">SX / DEVELOPER SYSTEM</text>
    <circle class="pulse" cx="718" cy="42" r="3.5" fill="#5CC8FF"/>
    <text x="730" y="46" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">SYSTEM ONLINE</text>

    <!-- identity -->
    <text x="40" y="150" class="mono" font-size="11" fill="#5CC8FF" letter-spacing="2">// 01 — IDENTITY</text>
    <text x="37" y="208" class="sans" font-size="58" font-weight="800" fill="#EEF1F5" letter-spacing="1">SWARAJ XAVIER</text>
    <text x="40" y="242" class="sans" font-size="13" font-weight="600" fill="#8A94A3" letter-spacing="5.2">FULL STACK WEB DEVELOPER</text>
    <rect x="40" y="266" width="28" height="1.5" fill="#5CC8FF"/>
    <text x="40" y="298" class="sans" font-size="17" fill="#C3CBD5">Interfaces, the systems behind them,</text>
    <text x="40" y="322" class="sans" font-size="17" fill="#C3CBD5">and things worth shipping.<tspan class="cur" fill="#5CC8FF"> _</tspan></text>

    <!-- metadata -->
    <text x="40" y="356" class="mono" font-size="10" fill="#465160" letter-spacing="1.4">19.31°N  84.79°E</text>
    <text x="216" y="356" class="mono" font-size="10" fill="#465160" letter-spacing="1.4">STACK  MERN / JAVA</text>
    <text x="408" y="356" class="mono" font-size="10" fill="#465160" letter-spacing="1.4">BUILD  2026.10</text>
    <text x="840" y="356" class="mono" font-size="10" fill="#465160" letter-spacing="1.4" text-anchor="end">github.com/demoxavi12</text>
  </g>
  <rect x=".5" y=".5" width="879" height="379" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
