<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-labelledby="tl-title tl-desc">
  <title id="tl-title">Build log — timeline from repository history</title>
  <desc id="tl-desc">October 2024: joined GitHub. May 2026: responsive landing pages in HTML and CSS. August 2026: DSA log starts, Java and LeetCode. September 2026: four full-stack apps, portfolio, PulseOps, real-time chat and e-commerce. Late September 2026: NIST FC. Now, October 2026: hardening and shipping.</desc>
  <defs><clipPath id="frame"><rect width="880" height="230" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .ring{transform-origin:810px 132px;transform-box:view-box;animation:ring 2.6s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:0}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="230" fill="#07090C"/>
    <text x="40" y="42" class="mono" font-size="11" fill="#5B6675" letter-spacing="1.6">sx://build-log</text>
    <text x="840" y="42" class="mono" font-size="11" fill="#4F5A69" letter-spacing="1.6" text-anchor="end">DATES FROM REPO HISTORY</text>
    <path d="M40 62H840" stroke="#141B24"/>

    <path d="M70 132H250" stroke="#1E2835" stroke-dasharray="2 5"/>
    <path d="M250 132H810" stroke="#1E2835"/>
    <path d="M540 132H810" stroke="#5CC8FF" stroke-opacity=".35"/>

    <g class="mono" font-size="11" fill="#5CC8FF" letter-spacing="1.4" text-anchor="middle">
      <text x="70" y="108">2024.10</text>
      <text x="250" y="108">2026.05</text>
      <text x="390" y="108">2026.08</text>
      <text x="540" y="108">2026.09</text>
      <text x="680" y="108">2026.09</text>
      <text x="810" y="108">NOW</text>
    </g>
    <g fill="#07090C" stroke="#3A4757">
      <circle cx="70" cy="132" r="4.5"/><circle cx="250" cy="132" r="4.5"/><circle cx="390" cy="132" r="4.5"/>
    </g>
    <g fill="#07090C" stroke="#5CC8FF">
      <circle cx="540" cy="132" r="4.5"/><circle cx="680" cy="132" r="4.5"/>
    </g>
    <circle class="ring" cx="810" cy="132" r="5" fill="none" stroke="#5CC8FF"/>
    <circle class="pulse" cx="810" cy="132" r="5" fill="#5CC8FF"/>

    <g class="sans" font-size="13.5" font-weight="700" fill="#E6EAF0" text-anchor="middle">
      <text x="70" y="166">JOINED GITHUB</text>
      <text x="250" y="166">LANDING PAGES</text>
      <text x="390" y="166">DSA LOG</text>
      <text x="540" y="166">4 FULL-STACK APPS</text>
      <text x="680" y="166">NIST FC</text>
      <text x="810" y="166">SHIPPING</text>
    </g>
    <g class="mono" font-size="10" fill="#5B6675" letter-spacing=".6" text-anchor="middle">
      <text x="70" y="186">account created</text>
      <text x="250" y="186">HTML · CSS</text>
      <text x="390" y="186">Java · LeetCode</text>
      <text x="540" y="186">MERN · Redis · Socket.IO</text>
      <text x="680" y="186">team archive</text>
      <text x="810" y="186">harden · polish</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="229" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
