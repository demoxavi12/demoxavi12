<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-labelledby="t d">
  <title id="t">Engineering log</title>
  <desc id="d">Timeline from repository history. 2024.10 joined GitHub. 2026.05 responsive landing pages. 2026.08 DSA log starts in Java. 2026.09 four full-stack apps. 2026.09 NIST FC. Now: shipping.</desc>
  <defs>
    <clipPath id="frame"><rect width="560" height="450" rx="16"/></clipPath>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2C3A"/><stop offset=".45" stop-color="#2A4A60"/><stop offset="1" stop-color="#5CC8FF"/></linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/><stop offset="1" stop-color="#CFF1FF"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .comet{animation:comet 5s cubic-bezier(.55,0,.35,1) infinite}
    @keyframes comet{0%{transform:translateY(0);opacity:0}8%{opacity:1}80%{transform:translateY(300px);opacity:1}88%,100%{transform:translateY(300px);opacity:0}}
    .ring{transform-origin:150px 390px;animation:ring 2.2s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="560" height="450" fill="#07090C"/>
    <path d="M150 60V126" stroke="#1E2C3A" stroke-width="2" stroke-dasharray="2 5"/>
    <rect x="149" y="126" width="2" height="264" fill="url(#line)"/>
    <rect class="comet" x="148.5" y="60" width="3" height="30" rx="1.5" fill="url(#comet)" filter="url(#glow)"/>
    <text x="124" y="66" class="mono" font-size="15" font-weight="700" fill="#6FAFD0" letter-spacing="1.2" text-anchor="end">2024.10</text><circle cx="150" cy="60" r="6" fill="#07090C" stroke="#3E6A85" stroke-width="2"/><text x="178" y="62" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">Joined GitHub</text><text x="178" y="84" class="mono" font-size="13" fill="#6C7787">account created</text><text x="124" y="132" class="mono" font-size="15" font-weight="700" fill="#6FAFD0" letter-spacing="1.2" text-anchor="end">2026.05</text><circle cx="150" cy="126" r="6" fill="#07090C" stroke="#3E6A85" stroke-width="2"/><text x="178" y="128" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">Landing pages</text><text x="178" y="150" class="mono" font-size="13" fill="#6C7787">responsive HTML · CSS</text><text x="124" y="198" class="mono" font-size="15" font-weight="700" fill="#6FAFD0" letter-spacing="1.2" text-anchor="end">2026.08</text><circle cx="150" cy="192" r="6" fill="#07090C" stroke="#3E6A85" stroke-width="2"/><text x="178" y="194" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">DSA log starts</text><text x="178" y="216" class="mono" font-size="13" fill="#6C7787">Java · LeetCode, logged in public</text><text x="124" y="264" class="mono" font-size="15" font-weight="700" fill="#6FAFD0" letter-spacing="1.2" text-anchor="end">2026.09</text><circle cx="150" cy="258" r="6" fill="#07090C" stroke="#5CC8FF" stroke-width="2"/><text x="178" y="260" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">Four full-stack apps</text><text x="178" y="282" class="mono" font-size="13" fill="#6C7787">MERN · Redis · Socket.IO</text><text x="124" y="330" class="mono" font-size="15" font-weight="700" fill="#6FAFD0" letter-spacing="1.2" text-anchor="end">2026.09</text><circle cx="150" cy="324" r="6" fill="#07090C" stroke="#5CC8FF" stroke-width="2"/><text x="178" y="326" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">NIST FC</text><text x="178" y="348" class="mono" font-size="13" fill="#6C7787">football team archive</text><text x="124" y="396" class="mono" font-size="15" font-weight="700" fill="#5CC8FF" letter-spacing="1.2" text-anchor="end">NOW</text><circle class="ring" cx="150" cy="390" r="7" fill="none" stroke="#5CC8FF"/><circle cx="150" cy="390" r="7" fill="#5CC8FF" filter="url(#glow)"/><text x="178" y="392" class="sans" font-size="21" font-weight="800" fill="#EEF1F5">Shipping</text><text x="178" y="414" class="mono" font-size="13" fill="#6C7787">hardening, polishing, learning</text>
  </g>
  <rect x=".5" y=".5" width="559" height="449" rx="15.5" fill="none" stroke="#16202B"/>
</svg>
