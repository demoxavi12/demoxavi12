<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="status-title status-desc">
  <title id="status-title">System status: online</title>
  <desc id="status-desc">Role: Full Stack Web Developer. Building: web applications and product experiences. Current focus: MERN, Java, DSA, AI. Mode: build, learn, ship, repeat.</desc>
  <defs><clipPath id="frame"><rect width="880" height="220" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .step{fill:#5B6675;animation:step 10s infinite}
    .s2{animation-delay:2.5s}.s3{animation-delay:5s}.s4{animation-delay:7.5s}
    @keyframes step{0%,22%{fill:#5CC8FF}25%,100%{fill:#5B6675}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.step{fill:#8A94A3}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="220" fill="#07090C"/>
    <text x="40" y="42" class="mono" font-size="11" fill="#5B6675" letter-spacing="1.6">sx://status</text>
    <circle class="pulse" cx="782" cy="38" r="3.5" fill="#5CC8FF"/>
    <text x="794" y="42" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">ONLINE</text>
    <path d="M40 62H840" stroke="#141B24"/>
    <path d="M440 82V196" stroke="#141B24"/>

    <text x="40" y="98" class="mono" font-size="10.5" fill="#4F5A69" letter-spacing="2">ROLE</text>
    <text x="40" y="126" class="sans" font-size="18" fill="#E6EAF0">Full Stack Web Developer</text>

    <text x="472" y="98" class="mono" font-size="10.5" fill="#4F5A69" letter-spacing="2">BUILDING</text>
    <text x="472" y="126" class="sans" font-size="18" fill="#E6EAF0">Web apps &amp; product experiences</text>

    <text x="40" y="160" class="mono" font-size="10.5" fill="#4F5A69" letter-spacing="2">CURRENT FOCUS</text>
    <text x="40" y="188" class="sans" font-size="18" fill="#E6EAF0">MERN · Java · DSA · AI</text>

    <text x="472" y="160" class="mono" font-size="10.5" fill="#4F5A69" letter-spacing="2">MODE</text>
    <text x="472" y="188" class="mono" font-size="15" font-weight="600" letter-spacing="1.2"><tspan class="step">BUILD</tspan><tspan fill="#2E3846"> → </tspan><tspan class="step s2">LEARN</tspan><tspan fill="#2E3846"> → </tspan><tspan class="step s3">SHIP</tspan><tspan fill="#2E3846"> → </tspan><tspan class="step s4">REPEAT</tspan></text>
  </g>
  <rect x=".5" y=".5" width="879" height="219" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
