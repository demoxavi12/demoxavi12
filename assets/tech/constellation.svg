    <clipPath id="frame"><rect width="880" height="660" rx="16"/></clipPath>
    <radialGradient id="core-glow"><stop offset="0" stop-color="#5CC8FF" stop-opacity=".22"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
  </defs>
