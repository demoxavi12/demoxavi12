    <text x="271.8" y="82.9" class="sans" font-size="17" fill="#AEB9C6" text-anchor="end">Vite</text><text x="368.2" y="82.9" class="sans" font-size="17" fill="#AEB9C6" text-anchor="start">Tailwind CSS</text><text x="338" y="157" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="start">React</text><text x="505.6" y="162.2" class="sans" font-size="17" fill="#AEB9C6" text-anchor="start">Socket.IO</text><text x="542.8" y="226.7" class="sans" font-size="17" fill="#AEB9C6" text-anchor="start">JWT</text><text x="449.9" y="205" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="middle">Node.js</text><text x="531.9" y="422" class="sans" font-size="17" fill="#AEB9C6" text-anchor="start">REST APIs</text><text x="449.9" y="411" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="middle">Express</text><text x="368.2" y="529.1" class="sans" font-size="17" fill="#AEB9C6" text-anchor="start">Redis</text><text x="271.8" y="529.1" class="sans" font-size="17" fill="#AEB9C6" text-anchor="end">Mongoose</text><text x="338" y="457" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="start">MongoDB</text><text x="134.4" y="449.8" class="sans" font-size="17" fill="#AEB9C6" text-anchor="end">DSA</text><text x="97.2" y="385.3" class="sans" font-size="17" fill="#AEB9C6" text-anchor="end">Python</text><text x="190.1" y="411" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="middle">Java</text><text x="108.1" y="190" class="sans" font-size="17" fill="#AEB9C6" text-anchor="end">HTML / CSS</text><text x="190.1" y="205" class="sans" font-size="21" font-weight="800" fill="#EEF1F5" text-anchor="middle">JavaScript</text>
