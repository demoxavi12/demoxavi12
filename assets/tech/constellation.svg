    <rect width="640" height="610" fill="url(#dots)"/>
    <circle cx="320" cy="300" r="270" fill="url(#core)"/>
    <circle cx="320" cy="300" r="150" fill="none" stroke="#111A24" stroke-dasharray="2 6"/>
    <g class="spin2"><circle cx="320" cy="300" r="244" fill="none" stroke="#0F1720" stroke-dasharray="1 10"/></g>
