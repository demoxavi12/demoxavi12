<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" width="640" height="610" role="img" aria-labelledby="t d">
  <title id="t">Tech constellation</title>
  <desc id="d">A live network centred on Swaraj. Core technologies: React (with Vite, Tailwind CSS), Node.js (Socket.IO, JWT), Express (REST APIs), MongoDB (Redis, Mongoose), Java (DSA, Python), JavaScript (HTML and CSS). Ships with Git, GitHub, Vercel and Cloudinary.</desc>
  <defs>
    <clipPath id="frame"><rect width="640" height="610" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#121A23"/></pattern>
    <radialGradient id="core" cx="50%" cy="49%" r="50%"><stop offset="0" stop-color="#5CC8FF" stop-opacity=".2"/><stop offset=".5" stop-color="#5CC8FF" stop-opacity=".05"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
    <filter id="g2" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g6" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .flow{animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-22}}
    .halo{opacity:.18;animation:halo 3.2s ease-in-out infinite}
    @keyframes halo{0%,100%{opacity:.12}50%{opacity:.42}}
    .spin{transform-origin:320px 300px;animation:spin 22s linear infinite}
    .spin2{transform-origin:320px 300px;animation:spin 60s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .wave{transform-origin:320px 300px;animation:wave 3.6s ease-out infinite}
    @keyframes wave{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
