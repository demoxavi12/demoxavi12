  <title id="map-title">Tech constellation — a system map of the stack</title>
  <desc id="map-desc">Core node Swaraj connects to five clusters. Frontend: React, JavaScript, Vite, Tailwind CSS, HTML and CSS. Backend: Node.js, Express, REST APIs, Socket.IO, JWT. Data: MongoDB, Mongoose, Redis. Languages and CS: Java, DSA, Python. Ship: Git and GitHub, Vercel, Cloudinary, Vitest and Playwright.</desc>
