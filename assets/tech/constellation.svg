    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sig{stroke-dasharray:10 600;stroke-dashoffset:10;animation:sig 7s cubic-bezier(.5,0,.3,1) infinite}
    @keyframes sig{0%{stroke-dashoffset:10;opacity:0}6%{opacity:1}38%{stroke-dashoffset:-260;opacity:0}100%{stroke-dashoffset:-260;opacity:0}}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{opacity:0}}
  </style>
