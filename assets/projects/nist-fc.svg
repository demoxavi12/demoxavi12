<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
  <title id="t">Project 03: NIST FC</title>
  <desc id="d">NIST FC, the website and digital archive of the NIST University football team. Player face cards with batch, branch, position, current and former players. Memories timeline with photos uploaded through Cloudinary. Admin panel for players and memories.</desc>
  <defs><clipPath id="frame"><rect width="880" height="340" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="340" fill="#07090C"/>
    <g stroke="#161E28" fill="none">
      <path d="M560 62V340"/><path d="M712 62V340"/><circle cx="712" cy="200" r="66"/>
      <path d="M880 118H832V282H880"/><path d="M880 164H858V236H880"/>
    </g>
    <circle cx="712" cy="200" r="2.5" fill="#1B2430"/>
    <g transform="translate(640 96)">
      <rect width="144" height="196" rx="10" fill="#0B0F15" stroke="#1E2835"/>
      <rect x="10" y="10" width="124" height="96" rx="6" fill="#0F141B"/>
      <circle cx="72" cy="50" r="18" fill="#18202A"/><path d="M40 106C44 82 58 74 72 74S100 82 104 106Z" fill="#18202A"/>
      <text x="18" y="28" class="mono" font-size="9" fill="#5CC8FF" letter-spacing="1.5">FC</text>
      <rect x="16" y="120" width="76" height="7" rx="3.5" fill="#2A3544"/>
      <text x="16" y="150" class="mono" font-size="8.5" fill="#4F5A69" letter-spacing="1.4">BATCH</text><rect x="66" y="143" width="62" height="5" rx="2.5" fill="#18202A"/><text x="16" y="166" class="mono" font-size="8.5" fill="#4F5A69" letter-spacing="1.4">BRANCH</text><rect x="66" y="159" width="62" height="5" rx="2.5" fill="#18202A"/><text x="16" y="182" class="mono" font-size="8.5" fill="#4F5A69" letter-spacing="1.4">POSITION</text><rect x="78" y="175" width="50" height="5" rx="2.5" fill="#18202A"/>
    </g>
    <text x="40" y="44" class="mono" font-size="11" fill="#5CC8FF" letter-spacing="2">PROJECT_03</text>
    <g transform="translate(728 44)"><circle class="pulse" cx="0" cy="-4" r="3.5" fill="#5CC8FF"/><text x="12" y="0" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">ACTIVE BUILD</text></g>
    <path d="M40 62H840" stroke="#141B24"/>
    <text x="38" y="118" class="sans" font-size="40" font-weight="800" fill="#EEF1F5" letter-spacing=".5">NIST FC</text>
    <text x="40" y="148" class="sans" font-size="15.5" fill="#8A94A3">Website &amp; living archive of the NIST University football team</text>
    <text x="40" y="194" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Player face cards: batch, branch, position, current &amp; former</text>
    <text x="40" y="222" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Memories timeline with photo uploads via Cloudinary</text>
    <text x="40" y="250" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Admin panel to manage players, memories and the archive</text>
    <path d="M40 282H520" stroke="#141B24"/>
    <text x="40" y="310" class="mono" font-size="11.5" fill="#6C7787" letter-spacing="1.2">React<tspan fill="#2E3846">  /  </tspan>Tailwind<tspan fill="#2E3846">  /  </tspan>Express<tspan fill="#2E3846">  /  </tspan>MongoDB<tspan fill="#2E3846">  /  </tspan>Cloudinary<tspan fill="#2E3846">  /  </tspan>JWT</text>
  </g>
  <rect x=".5" y=".5" width="879" height="339" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
