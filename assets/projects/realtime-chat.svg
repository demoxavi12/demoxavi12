<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
  <title id="t">Project 02: REAL-TIME CHAT</title>
  <desc id="d">Real-time chat application. Messages are persisted before acknowledgement and then broadcast; retries are de-duplicated. Typing indicators, read receipts, presence, reconnect with resync. HttpOnly JWT sessions, Argon2id hashing, server-side revocation. Tested with Vitest, Playwright and GitHub Actions CI.</desc>
  <defs><clipPath id="frame"><rect width="880" height="340" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .msg{animation:msg 6s cubic-bezier(.5,0,.3,1) infinite}
    @keyframes msg{0%{transform:translate(0,0);opacity:0}5%{opacity:1}22%{transform:translate(104px,0)}40%{transform:translate(208px,30px)}58%{transform:translate(104px,60px)}76%{transform:translate(0,90px);opacity:1}86%,100%{transform:translate(0,90px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="340" fill="#07090C"/>
    <path d="M560 82V300" stroke="#141B24"/>
    <text x="596" y="100" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="middle">CLIENT</text><text x="700" y="100" class="mono" font-size="10" fill="#8A94A3" letter-spacing="1.8" text-anchor="middle">GATEWAY</text><text x="804" y="100" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="middle">MONGODB</text>
    <path d="M596 112V262" stroke="#18202A" stroke-dasharray="2 4"/><path d="M700 112V262" stroke="#18202A" stroke-dasharray="2 4"/><path d="M804 112V262" stroke="#18202A" stroke-dasharray="2 4"/>
    <path d="M596 140H694" stroke="#334050"/><path d="M690 136L696 140L690 144" fill="none" stroke="#334050"/>
    <path d="M700 170H798" stroke="#334050"/><path d="M794 166L800 170L794 174" fill="none" stroke="#334050"/>
    <path d="M804 200H706" stroke="#334050"/><path d="M710 196L704 200L710 204" fill="none" stroke="#334050"/>
    <path d="M700 230H602" stroke="#334050"/><path d="M606 226L600 230L606 234" fill="none" stroke="#334050"/>
    <text x="646" y="132" class="mono" font-size="9" fill="#7D8898" text-anchor="middle">message:send</text>
    <text x="752" y="162" class="mono" font-size="9" fill="#7D8898" text-anchor="middle">persist</text>
    <text x="752" y="192" class="mono" font-size="9" fill="#7D8898" text-anchor="middle">saved</text>
    <text x="650" y="222" class="mono" font-size="9" fill="#7D8898" text-anchor="middle">ack + message:new</text>
    <circle class="msg" cx="596" cy="140" r="3.5" fill="#5CC8FF"/>
    <text x="596" y="296" class="mono" font-size="10" fill="#3E4957" letter-spacing="1.8" text-anchor="start">VITEST · PLAYWRIGHT · CI</text>
    <text x="40" y="44" class="mono" font-size="11" fill="#5CC8FF" letter-spacing="2">PROJECT_02</text>
    <g transform="translate(760 44)"><circle class="pulse" cx="0" cy="-4" r="3.5" fill="#5CC8FF"/><text x="12" y="0" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">DEPLOYED</text></g>
    <path d="M40 62H840" stroke="#141B24"/>
    <text x="38" y="118" class="sans" font-size="40" font-weight="800" fill="#EEF1F5" letter-spacing=".5">REAL-TIME CHAT</text>
    <text x="40" y="148" class="sans" font-size="15.5" fill="#8A94A3">Private &amp; public messaging over Socket.IO</text>
    <text x="40" y="194" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Messages persisted before ack, then broadcast; retries de-duplicated</text>
    <text x="40" y="222" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Typing, read receipts, presence, multi-tab reconnect + resync</text>
    <text x="40" y="250" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>HttpOnly JWT sessions, Argon2id, server-side revocation</text>
    <path d="M40 282H520" stroke="#141B24"/>
    <text x="40" y="310" class="mono" font-size="11.5" fill="#6C7787" letter-spacing="1.2">React<tspan fill="#2E3846">  /  </tspan>Node<tspan fill="#2E3846">  /  </tspan>Express<tspan fill="#2E3846">  /  </tspan>Socket.IO<tspan fill="#2E3846">  /  </tspan>MongoDB<tspan fill="#2E3846">  /  </tspan>JWT</text>
  </g>
  <rect x=".5" y=".5" width="879" height="339" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
