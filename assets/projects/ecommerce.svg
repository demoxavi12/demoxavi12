<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
  <title id="t">Project 04: E-COMMERCE PLATFORM</title>
  <desc id="d">E-commerce platform with a customer storefront, an admin panel and an Express REST API, each deployed on Vercel. JWT authentication, cart, checkout with cash on delivery, order history. Admin product management with Cloudinary uploads and order status updates: order placed, packing, shipped, out for delivery, delivered.</desc>
  <defs><clipPath id="frame"><rect width="880" height="340" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .st{fill:#2A3544;animation:st 10s infinite}
    @keyframes st{0%,16%{fill:#5CC8FF}20%,100%{fill:#2A3544}}
    .st0{animation-delay:0s}.st1{animation-delay:2s}.st2{animation-delay:4s}.st3{animation-delay:6s}.st4{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="340" fill="#07090C"/>
    <path d="M560 82V300" stroke="#141B24"/>
    <text x="600" y="106" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="start">ORDER LIFECYCLE</text>
    <path d="M606 132V276" stroke="#1E2835"/>
    <circle class="st st0" cx="606" cy="132" r="4.5"/><text x="626" y="136" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.4">ORDER PLACED</text>
    <circle class="st st1" cx="606" cy="168" r="4.5"/><text x="626" y="172" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.4">PACKING</text>
    <circle class="st st2" cx="606" cy="204" r="4.5"/><text x="626" y="208" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.4">SHIPPED</text>
    <circle class="st st3" cx="606" cy="240" r="4.5"/><text x="626" y="244" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.4">OUT FOR DELIVERY</text>
    <circle class="st st4" cx="606" cy="276" r="4.5"/><text x="626" y="280" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.4">DELIVERED</text>
    <text x="40" y="44" class="mono" font-size="11" fill="#5CC8FF" letter-spacing="2">PROJECT_04</text>
    <g transform="translate(760 44)"><circle class="pulse" cx="0" cy="-4" r="3.5" fill="#5CC8FF"/><text x="12" y="0" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">DEPLOYED</text></g>
    <path d="M40 62H840" stroke="#141B24"/>
    <text x="38" y="118" class="sans" font-size="34" font-weight="800" fill="#EEF1F5" letter-spacing=".5">E-COMMERCE PLATFORM</text>
    <text x="40" y="148" class="sans" font-size="15.5" fill="#8A94A3">Storefront, admin panel &amp; REST API — three deployed apps</text>
    <text x="40" y="194" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>JWT auth, cart, checkout (cash on delivery) and order history</text>
    <text x="40" y="222" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Admin product management with Cloudinary image uploads</text>
    <text x="40" y="250" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Order lifecycle driven from the admin dashboard</text>
    <path d="M40 282H520" stroke="#141B24"/>
    <text x="40" y="310" class="mono" font-size="11.5" fill="#6C7787" letter-spacing="1.2">React<tspan fill="#2E3846">  /  </tspan>Vite<tspan fill="#2E3846">  /  </tspan>Tailwind<tspan fill="#2E3846">  /  </tspan>Node<tspan fill="#2E3846">  /  </tspan>Express<tspan fill="#2E3846">  /  </tspan>MongoDB Atlas</text>
  </g>
  <rect x=".5" y=".5" width="879" height="339" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
