<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
  <title id="t">Project 01: PULSEOPS</title>
  <desc id="d">PulseOps, a notification and analytics dashboard. Ingests events from five services, Redis caching with invalidation, JWT and role-based access control, rate limiting. Redis caching improved API performance by about 45 percent, measured in this project during development.</desc>
  <defs><clipPath id="frame"><rect width="880" height="340" rx="16"/></clipPath></defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="340" fill="#07090C"/>
    <path d="M560 82V300" stroke="#141B24"/>
    <text x="592" y="106" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="start">API PERFORMANCE</text>
    <text x="588" y="182" class="sans" font-size="76" font-weight="800" fill="#5CC8FF" letter-spacing="-1">+45%</text>
    <text x="592" y="212" class="sans" font-size="15" fill="#C3CBD5">with Redis caching</text>
    <text x="592" y="250" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="start">REQUEST</text><text x="660" y="250" class="mono" font-size="10" fill="#2E3846">→</text><text x="676" y="250" class="mono" font-size="10" fill="#8A94A3" letter-spacing="1.8" text-anchor="start">REDIS</text><text x="728" y="250" class="mono" font-size="10" fill="#2E3846">→</text><text x="744" y="250" class="mono" font-size="10" fill="#4F5A69" letter-spacing="1.8" text-anchor="start">MONGODB</text>
    <text x="592" y="290" class="mono" font-size="9.5" fill="#3E4957" letter-spacing="1">* measured in this project during</text>
    <text x="592" y="304" class="mono" font-size="9.5" fill="#3E4957" letter-spacing="1">  development, not a general benchmark</text>
    <text x="40" y="44" class="mono" font-size="11" fill="#5CC8FF" letter-spacing="2">PROJECT_01</text>
    <g transform="translate(760 44)"><circle class="pulse" cx="0" cy="-4" r="3.5" fill="#5CC8FF"/><text x="12" y="0" class="mono" font-size="11" fill="#8A94A3" letter-spacing="1.6">DEPLOYED</text></g>
    <path d="M40 62H840" stroke="#141B24"/>
    <text x="38" y="118" class="sans" font-size="40" font-weight="800" fill="#EEF1F5" letter-spacing=".5">PULSEOPS</text>
    <text x="40" y="148" class="sans" font-size="15.5" fill="#8A94A3">Notification &amp; Analytics Dashboard — a mini SaaS system</text>
    <text x="40" y="194" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Ingests events from 5 services into MongoDB aggregation pipelines</text>
    <text x="40" y="222" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>Redis cache, invalidated on every ingest; in-memory fallback</text>
    <text x="40" y="250" class="sans" font-size="15" fill="#C3CBD5"><tspan fill="#5CC8FF" class="mono">→ </tspan>JWT auth with RBAC, rate-limited auth and ingestion routes</text>
    <path d="M40 282H520" stroke="#141B24"/>
    <text x="40" y="310" class="mono" font-size="11.5" fill="#6C7787" letter-spacing="1.2">React<tspan fill="#2E3846">  /  </tspan>Node<tspan fill="#2E3846">  /  </tspan>Express<tspan fill="#2E3846">  /  </tspan>MongoDB<tspan fill="#2E3846">  /  </tspan>Redis<tspan fill="#2E3846">  /  </tspan>JWT</text>
  </g>
  <rect x=".5" y=".5" width="879" height="339" rx="15.5" fill="none" stroke="#161D27"/>
</svg>
