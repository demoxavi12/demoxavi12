<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 132" width="280" height="132" role="img" aria-label="Product Engineering: finishing things properly">
  <defs>
    <clipPath id="frame"><rect width="280" height="132" rx="14"/></clipPath>
    <radialGradient id="g" cx="12%" cy="10%" r="70%"><stop offset="0" stop-color="#5CC8FF" stop-opacity=".16"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/><stop offset=".5" stop-color="#5CC8FF" stop-opacity=".9"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .pulse{animation:pulse 2.6s ease-in-out infinite;animation-delay:-1.95s}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .edge{animation:edge 8s ease-in-out infinite;animation-delay:-6s}
    @keyframes edge{0%{transform:translateX(-120px)}50%,100%{transform:translateX(280px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="280" height="132" fill="#0A0E14"/>
    <rect width="280" height="132" fill="url(#g)"/>
    <rect class="edge" x="0" y="0" width="120" height="1.5" fill="url(#edge)"/>
    <g transform="translate(22 22)"><g fill="none" stroke="#5CC8FF" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></g></g>
    <circle class="pulse" cx="256" cy="34" r="3.5" fill="#5CC8FF"/>
    <text x="22" y="86" class="sans" font-size="20" font-weight="800" fill="#EEF1F5">Product Engineering</text>
    <text x="22" y="110" class="mono" font-size="11.5" fill="#7A8594">finishing things properly</text>
  </g>
  <rect x=".5" y=".5" width="279" height="131" rx="13.5" fill="none" stroke="#1A2633"/>
</svg>
