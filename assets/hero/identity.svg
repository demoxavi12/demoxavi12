<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 430" width="450" height="430" role="img" aria-labelledby="t d">
  <title id="t">Swaraj Xavier — Full Stack Developer</title>
  <desc id="d">Online. Swaraj Xavier, full stack developer. Building things worth keeping. Building: web apps and product experiences. Exploring: MERN, Java, DSA, AI.</desc>
  <defs>
    <clipPath id="frame"><rect width="450" height="430" rx="16"/></clipPath>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#14202B"/></pattern>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="gm"><rect width="450" height="430" fill="url(#gridfade)"/></mask>
    <radialGradient id="glow" cx="30%" cy="38%" r="55%"><stop offset="0" stop-color="#5CC8FF" stop-opacity=".26"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
      <stop offset="0" stop-color="#EEF1F5"/><stop offset=".42" stop-color="#EEF1F5"/><stop offset=".5" stop-color="#A8E6FF"/><stop offset=".58" stop-color="#EEF1F5"/><stop offset="1" stop-color="#EEF1F5"/>
      <animate attributeName="x1" values="-260;460;460" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-60;660;660" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/><stop offset="1" stop-color="#5CC8FF" stop-opacity=".8"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .grid{animation:grid 6s linear infinite}
    @keyframes grid{to{transform:translateY(26px)}}
    .glow{animation:breathe 5s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
    .pt{animation:rise linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-110px);opacity:0}}
    .streak{animation:streak 9s cubic-bezier(.6,0,.3,1) infinite}
    .streak2{animation-delay:4.5s}
    @keyframes streak{0%{transform:translateX(-160px);opacity:0}4%{opacity:1}22%{transform:translateX(490px);opacity:0}100%{transform:translateX(490px);opacity:0}}
    .orbit{transform-origin:388px 74px;animation:spin 14s linear infinite}
    .orbit2{transform-origin:388px 74px;animation:spin 30s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .ring{transform-origin:31px 41px;animation:ring 2.2s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .tick{animation:tick 3s steps(1) infinite}
    @keyframes tick{0%{opacity:.25}33%{opacity:1}66%{opacity:.5}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="450" height="430" fill="#07090C"/>
    <g mask="url(#gm)"><rect class="grid" y="-26" width="450" height="456" fill="url(#grid)"/></g>
    <rect class="glow" width="450" height="430" fill="url(#glow)"/>
    <circle class="pt" style="animation-duration:7.5s;animation-delay:-8.8s" cx="20" cy="387" r="1.1" fill="#5CC8FF"/><circle class="pt" style="animation-duration:11.3s;animation-delay:-6.5s" cx="238.4" cy="215.5" r="1.7" fill="#3E6F8C"/><circle class="pt" style="animation-duration:7.7s;animation-delay:-4.5s" cx="300.7" cy="304.4" r="1.8" fill="#3E6F8C"/><circle class="pt" style="animation-duration:10.8s;animation-delay:-5.6s" cx="310.2" cy="322.4" r="0.9" fill="#5CC8FF"/><circle class="pt" style="animation-duration:9.6s;animation-delay:-11.1s" cx="398.2" cy="354.1" r="0.9" fill="#3E6F8C"/><circle class="pt" style="animation-duration:12.4s;animation-delay:-10.9s" cx="302.3" cy="306.7" r="1.5" fill="#3E6F8C"/><circle class="pt" style="animation-duration:8.3s;animation-delay:-1.8s" cx="172.6" cy="217.3" r="1.8" fill="#5CC8FF"/><circle class="pt" style="animation-duration:12.6s;animation-delay:-6.7s" cx="142" cy="244.3" r="1.2" fill="#3E6F8C"/><circle class="pt" style="animation-duration:7.9s;animation-delay:-6.7s" cx="319" cy="374.6" r="0.9" fill="#3E6F8C"/><circle class="pt" style="animation-duration:12.4s;animation-delay:-0.7s" cx="228.6" cy="242.2" r="1" fill="#5CC8FF"/><circle class="pt" style="animation-duration:12.5s;animation-delay:-6.2s" cx="169.8" cy="219.8" r="1.6" fill="#3E6F8C"/><circle class="pt" style="animation-duration:8.6s;animation-delay:-5.1s" cx="87.9" cy="237.6" r="1.1" fill="#3E6F8C"/><circle class="pt" style="animation-duration:7.6s;animation-delay:-10.9s" cx="156.4" cy="274.2" r="1.5" fill="#5CC8FF"/><circle class="pt" style="animation-duration:10.4s;animation-delay:-6.2s" cx="207.7" cy="370.3" r="1.6" fill="#3E6F8C"/><circle class="pt" style="animation-duration:8.8s;animation-delay:-8.5s" cx="227" cy="319.8" r="1.9" fill="#3E6F8C"/><circle class="pt" style="animation-duration:8.3s;animation-delay:-4.7s" cx="123" cy="290.2" r="1.2" fill="#5CC8FF"/>
    <rect class="streak" x="0" y="112" width="140" height="1" fill="url(#streak)"/>
    <rect class="streak streak2" x="0" y="306" width="110" height="1" fill="url(#streak)"/>

    <!-- orbital HUD -->
    <g fill="none">
      <circle cx="388" cy="74" r="38" stroke="#1B2734"/>
      <circle cx="388" cy="74" r="24" stroke="#1B2734" stroke-dasharray="2 4"/>
      <g class="orbit"><path d="M388 36A38 38 0 0 1 426 74" stroke="#5CC8FF" stroke-width="1.5"/><circle cx="426" cy="74" r="2.6" fill="#5CC8FF"/></g>
      <g class="orbit2"><circle cx="388" cy="50" r="2" fill="#7FA7C0"/></g>
    </g>
    <circle cx="388" cy="74" r="3" fill="#5CC8FF"/>

    <!-- status -->
    <circle class="ring" cx="31" cy="41" r="4" fill="none" stroke="#5CC8FF"/>
    <circle class="pulse" cx="31" cy="41" r="4" fill="#5CC8FF"/>
    <text x="44" y="45" class="mono" font-size="11.5" font-weight="700" fill="#5CC8FF" letter-spacing="2">ONLINE</text>
    <text x="104" y="45" class="mono" font-size="11.5" fill="#4F5A69" letter-spacing="2">/ 2026</text>

    <!-- identity -->
    <text x="26" y="148" class="sans" font-size="64" font-weight="900" fill="url(#shine)" letter-spacing="1">SWARAJ</text>
    <text x="26" y="210" class="sans" font-size="64" font-weight="900" fill="url(#shine)" letter-spacing="1">XAVIER</text>
    <rect x="28" y="230" width="34" height="3" rx="1.5" fill="#5CC8FF"/>
    <text x="72" y="235" class="mono" font-size="12.5" font-weight="700" fill="#5CC8FF" letter-spacing="3.4">FULL STACK DEVELOPER</text>
    <text x="28" y="276" class="sans" font-size="19" fill="#D5DCE5">Building things worth keeping.<tspan class="cur" fill="#5CC8FF"> ▍</tspan></text>

    <!-- now -->
    <path d="M28 306H422" stroke="#16202B"/>
    <circle cx="28" cy="306" r="2" fill="#5CC8FF"/><circle class="tick" cx="422" cy="306" r="2" fill="#5CC8FF"/>
    <text x="28" y="338" class="mono" font-size="10.5" fill="#5B6675" letter-spacing="2.2">BUILDING</text>
    <text x="28" y="362" class="sans" font-size="16.5" fill="#EEF1F5">Web apps &amp; product experiences</text>
    <text x="28" y="392" class="mono" font-size="10.5" fill="#5B6675" letter-spacing="2.2">EXPLORING</text>
    <text x="28" y="414" class="mono" font-size="14.5" font-weight="700" fill="#EEF1F5" letter-spacing="1.2">MERN <tspan fill="#5CC8FF">/</tspan> JAVA <tspan fill="#5CC8FF">/</tspan> DSA <tspan fill="#5CC8FF">/</tspan> AI</text>
  </g>
  <rect x=".5" y=".5" width="449" height="429" rx="15.5" fill="none" stroke="#1A2633"/>
</svg>
