name: telemetry

# Re-renders assets/generated/telemetry.svg from live GitHub data.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render telemetry.svg
        run: node scripts/generate-telemetry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Commit only when the numbers moved, not when just the sync date did.
      - name: Commit if changed
        run: |
          if git diff --quiet -I 'SYNCED|Synced' -- assets/generated/telemetry.svg; then
            echo "No telemetry change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/telemetry.svg
          git commit -m "chore(telemetry): sync $(date -u +%F)"
          git push
