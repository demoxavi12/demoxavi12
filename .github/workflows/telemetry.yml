name: profile

# Re-renders the animated profile (assets/generated/profile*.svg) from live GitHub data.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render profile
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Commit only when the numbers moved, not when just the sync date did.
      - name: Commit if changed
        run: |
          if git diff --quiet -I 'synced 20' -- assets/generated/; then
            echo "No profile change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          git commit -m "chore(profile): sync $(date -u +%F)"
          git push
